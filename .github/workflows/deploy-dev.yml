# Deploy Sentiment Analysis API to Cloud Run (development).
# Triggered on push to develop.

name: Deploy Development

on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "scripts/**"
      - "config.yaml"

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  Deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      project_id: ruxailab-develop
      region: us-central1
      repo: containers
      image: sentiment-analysis-api
      service: sentiment-analysis-api
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_DEV }}
