# Shared build + deploy logic for Cloud Run (CPU-only).
# Called by deploy-prod.yml and deploy-dev.yml.
#
# Required secrets (mapped by each caller — keys differ per GCP project):
#   - GCP_SA_KEY: JSON key for that environment's GCP service account
#     (Artifact Registry Writer, Cloud Run Admin, Service Account User)

name: Deploy to Cloud Run (reusable)

on:
  workflow_call:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        type: string
      service:
        description: Cloud Run service name
        required: true
        type: string
      region:
        description: GCP region
        required: false
        type: string
        default: us-central1
      repo:
        description: Artifact Registry repository name
        required: false
        type: string
        default: containers
      image:
        description: Docker image name
        required: false
        type: string
        default: sentiment-analysis-api
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  Build:
    name: Build and Push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      REPO: ${{ inputs.repo }}
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${TAG}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

  Deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      SERVICE: ${{ inputs.service }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 4Gi \
            --port 8001

      - name: Delete image from Artifact Registry
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          gcloud artifacts docker images delete "${IMAGE_URI}" \
            --delete-tags \
            --quiet
