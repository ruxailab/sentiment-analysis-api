# Deploy Sentiment Analysis API to Cloud Run (CPU-only).
#
# Required GitHub Secrets:
#   - GCP_SA_KEY: JSON key for a GCP service account with Artifact Registry
#     Writer, Cloud Run Admin, and Service Account User roles

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "scripts/**"
      - "config.yaml"

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

env:
  PROJECT_ID: ruxailab-develop
  REGION: us-central1
  REPO: containers
  IMAGE: sentiment-analysis-api
  SERVICE: sentiment-analysis-api

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${TAG}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 4Gi \
            --port 8001

      - name: Delete image from Artifact Registry
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          gcloud artifacts docker images delete "${IMAGE_URI}" \
            --delete-tags \
            --quiet
